        /* FIX BACKGROUND PUTIH */
        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: url("img/background.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #0984e3;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #74b9ff;
            border-radius: 15px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #0984e3;
            outline: none;
            box-shadow: 0 0 10px rgba(9, 132, 227, 0.3);
        }

        button {
            background: linear-gradient(45deg, #0984e3, #6c5ce7);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.4);
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        li {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            color: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        li:hover {
            transform: scale(1.05);
        }

        .no-result {
            background: none;
            color: #0984e3;
            font-style: italic;
        }
    </style>
</head>

        // Brute Force String Matching
        function match(text, pattern) {
            text = text.toLowerCase();
            pattern = pattern.toLowerCase();

            for (let i = 0; i <= text.length - pattern.length; i++) {
                let j = 0;
                while (j < pattern.length && text[i + j] === pattern[j]) {
                    j++;
                }
                if (j === pattern.length) return true;
            }
            return false;
        }

        function search() {
            const keyword = document.getElementById("keyword").value.trim();
            const result = document.getElementById("result");
            result.innerHTML = "";

            if (keyword === "") {
                result.innerHTML = "<li class='no-result'>Masukkan kata kunci pencarian 😊</li>";
                return;
            }

            let found = false;

            mahasiswa.forEach(m => {
                if (
                    match(m.nim, keyword) ||
                    match(m.nama, keyword) ||
                    match(m.prodi, keyword)
                ) {
                    result.innerHTML += `
                        <li>👤 ${m.nim} - ${m.nama} (${m.prodi})</li>
                    `;
                    found = true;
                }
            });

            if (!found) {
                result.innerHTML = "<li class='no-result'>Data tidak ditemukan 😔</li>";
            }
        }
